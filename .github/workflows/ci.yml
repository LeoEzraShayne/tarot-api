name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run check
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: [self-hosted, tarot-api-prod]
    concurrency: { group: tarot-api-production, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --omit=dev
      - run: npm run migrate
      - name: Publish release
        run: sudo /usr/local/bin/deploy-tarot-api "$GITHUB_WORKSPACE" "$GITHUB_SHA"
